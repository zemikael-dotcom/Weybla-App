name: Build Weybla Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - name: Add Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - run: npx cap sync android
      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/weybla.keystore
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/weybla.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out Weybla-release.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner verify Weybla-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Weybla-Release-APK
          path: Weybla-release.apk
